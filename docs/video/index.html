<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jewish Nudger — open-app reminder</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.55;
      color: #1a1a1a;
      background: #f7f6f2;
    }
    main {
      max-width: 42rem;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
      background: #fff;
    }
    h1 { font-size: 1.8rem; line-height: 1.2; margin-bottom: 0.25rem; }
    p { font-size: 1.05rem; }
    .meta { color: #444; }
    video {
      display: block;
      width: min(100%, 22rem);
      margin: 1.5rem auto 0;
      background: #111;
      border-radius: 12px;
    }
  </style>
</head>
<body>
<main>
  <h1>Open-app reminder</h1>
  <p class="meta">Jewish Nudger. The reminder shown when another app is opened during Sfirat HaOmer.</p>
  <video controls playsinline preload="metadata" src="reminder.mp4">
    <a href="reminder.mp4">Download the video</a>
  </video>
</main>
</body>
</html>
